[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    -v
    --tb=short
    --cov=document_processor
    --cov=vector_store
    --cov=qa_engine
    --cov=evaluator
    --cov-report=term-missing
    --cov-report=html:coverage_report
    --cov-fail-under=95
